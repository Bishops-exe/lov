[package]
name = "rs"
version = "0.1.0"
authors = ["Bishops-exe"]
edition = "2018"
license = "LICENSE"
repository = ""
description = "Rust part of lov"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.63"

toml = "1.1.2"
json5 = "1.3.1"
serde-saphyr = "0.0.26"
csv = "1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
dev=["dep:console_error_panic_hook"]


[profile.release]
# We don't gaf for small code size.
opt-level = "z"
